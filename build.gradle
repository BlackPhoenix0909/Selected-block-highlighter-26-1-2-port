plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.shedaniel.me/" } // Cloth Config
	maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"selected-block-highlighter" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// 26.1.2 ist eine unobfuskierte Minecraft-Version (offizielle Mojang-
	// Namen direkt, kein Yarn/Intermediary mehr noetig). Deshalb wie im
	// offiziellen FabricMC-Template "implementation" statt "modImplementation"
	// fuer Minecraft/Loader/Fabric-API - kein "mappings"-Aufruf mehr noetig.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Cloth Config und Mod Menu sind eigenstaendige Mods (mit eigenem
	// fabric.mod.json). Bei der neuen "net.fabricmc.fabric-loom"-Variante
	// fuer unobfuskierte Minecraft-Versionen gibt es keine modImplementation-
	// Konfiguration mehr (kein Remapping noetig) - daher normales implementation.
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
